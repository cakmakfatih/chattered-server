name: Go tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read

jobs:
  test:
    name: Run Go tests
    if: github.event_name != 'pull_request_review' || (github.event.pull_request.base.ref == 'dev' && github.event.review.state == 'approved')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./...
